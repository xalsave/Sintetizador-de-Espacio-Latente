; platformio.ini - Firmware de la CYD (ESP32-2432S028R)
; Bloque A (20 ago): tactil -> UART al S3, y de vuelta la onda -> pantalla.

[env:cyd]
platform      = espressif32
board         = esp32dev          ; la CYD lleva un ESP32-WROOM (no S3), 4 MB flash
framework     = arduino
monitor_speed = 115200

; Puerto fijo, por lo mismo que el S3 tiene fijado el suyo: con las dos placas
; enchufadas a la vez, el autodetect puede coger la equivocada. Si el sistema le
; asigna otro COM, se cambia aqui.
upload_port   = COM6
monitor_port  = COM6

lib_deps =
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    bodmer/TFT_eSPI@^2.5.43

; --- Configuracion de TFT_eSPI para la ESP32-2432S028R -----------------------
; Va aqui a proposito: con USER_SETUP_LOADED la libreria IGNORA su User_Setup.h,
; asi que la configuracion viaja en el repo y no se pierde al reinstalar la
; libreria ni al clonar el proyecto en otro PC. NO editar User_Setup.h.
;
; La pantalla cuelga del HSPI (pines 12/13/14/15, que son los nativos del HSPI y
; por tanto usan la ruta rapida por IOMUX). El tactil XPT2046 se queda en el VSPI
; con sus pines de fabrica (25/32/33/39) desde el codigo: son dos buses SPI
; distintos, y por eso pueden convivir sin bloquearse.
build_flags =
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1         ; variante correcta para esta CYD (ver nota 1)
    -D USE_HSPI_PORT=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1                 ; el RST del panel cuelga del EN del ESP32
    -D TFT_BL=21                  ; retroiluminacion (ver nota 2)
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1

; Nota 1 - colores: si el patron de prueba sale con los colores invertidos
;   (rojo <-> azul), cambia ILI9341_2_DRIVER por ILI9341_DRIVER. Si sale en
;   negativo, anade -D TFT_INVERSION_ON. Son las dos unicas variantes que
;   circulan de esta placa.
; Nota 2 - IO21 es la retroiluminacion y arranca APAGADA: aunque la pantalla
;   este pintando bien, se ve negra hasta que se pone IO21 en alto. main.cpp la
;   enciende explicitamente ademas de declararla aqui.
