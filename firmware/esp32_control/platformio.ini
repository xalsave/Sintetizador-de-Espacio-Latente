; platformio.ini - Firmware del ESP32-S3 (cerebro)
; Sesion 6, paso 1: validar la interpolacion bilineal del grid 16x16 sin la CYD.

[env:esp32-s3]
platform      = espressif32
board         = 4d_systems_esp32s3_gen4_r8n16
framework     = arduino
monitor_speed = 115200
board_build.flash_size = 16MB

; Puerto fijo del S3, para que el monitor/upload nunca se confunda con el
; puerto de la CYD (COM6) cuando ambas placas esten enchufadas a la vez.
upload_port   = COM3
monitor_port  = COM3

; send_on_enter: manda todo al pulsar Enter (no caracter a caracter).
; log2file:      guarda TODO lo que imprime la placa en monitor.log, en la
;                raiz del proyecto (esp32_control/monitor.log).
monitor_filters = send_on_enter, log2file
monitor_eol     = CRLF
monitor_echo    = yes

; Comentada porque usamos puerto COM/UART, no USB nativo.
;    -DARDUINO_USB_CDC_ON_BOOT=1